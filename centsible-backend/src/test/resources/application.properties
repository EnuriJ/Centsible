spring.application.name=centsible-backend-test

# Use in-memory H2 database for unit tests to prevent state leakage and avoid mutating ./data/centsible
spring.datasource.url=jdbc:h2:mem:centsibletest;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT settings
centsible.jwt.secret=test-jwt-secret-key-must-be-at-least-256-bits-long-for-testing-purpose!
centsible.jwt.expiration-ms=3600000

# H2 console disabled by default in test/prod
spring.h2.console.enabled=false
