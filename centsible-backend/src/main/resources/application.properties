spring.application.name=centsible-backend

# H2 file-based database - persists to ./data/centsible.mv.db, no separate DB server needed
spring.datasource.url=jdbc:h2:file:./data/centsible;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console for browsing data during dev: http://localhost:8080/h2-console
# JDBC URL to use when logging into the console: jdbc:h2:file:./data/centsible
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Multipart upload limits (Spring's default is 1MB, too small for real CSV exports)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
