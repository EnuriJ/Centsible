# Production profile - activate with SPRING_PROFILES_ACTIVE=prod
#
# Everything here overrides application.properties. Unlike the local-dev defaults, secrets
# and environment-specific values have NO fallbacks: if one is missing, the app refuses to
# start instead of quietly running with something insecure.

# ---- Database: managed PostgreSQL (not the local H2 file) ----
# DATABASE_URL must be a JDBC URL, e.g. jdbc:postgresql://host:5432/centsible?sslmode=require
# Note: many hosts hand out a "postgres://user:pass@host/db" style URL - that is NOT a JDBC
# URL. Convert it, and put the username/password in the separate variables below.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Hibernate creates/updates tables to match the entities. Fine for a small single-instance
# app; a larger one would use versioned migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# The H2 web console must never be reachable in production
spring.h2.console.enabled=false

# ---- Secrets and origins: required, no defaults ----
centsible.jwt.secret=${JWT_SECRET}
centsible.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---- Hosting ----
# Most platforms tell the app which port to listen on via PORT
server.port=${PORT:8080}
# Behind the platform's proxy, resolve the real client address (used by the login/signup
# rate limiter) from the proxy's forwarded header - only trusted when the request actually
# arrived through a trusted proxy, so clients can't spoof it.
server.forward-headers-strategy=native
