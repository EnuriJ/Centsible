# Production profile - activate with SPRING_PROFILES_ACTIVE=prod
#
# Everything here overrides application.properties. Unlike the local-dev defaults, secrets
# and environment-specific values have NO fallbacks: if one is missing, the app refuses to
# start instead of quietly running with something insecure.

# ---- Database: managed PostgreSQL (not the local H2 file) ----
# DATABASE_URL can be either form:
#   * the "postgres://user:password@host/db" URL most hosts hand out - paste it as-is and
#     DatabaseUrlEnvironmentPostProcessor converts it (and takes the user/password from it), or
#   * a JDBC URL (jdbc:postgresql://host:5432/db?sslmode=require), with the login in
#     DATABASE_USERNAME and DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driverClassName=org.postgresql.Driver

# Small pool: serverless/free-tier databases allow only a handful of connections, and may
# pause when idle, so don't keep connections around for long.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

# Hibernate creates/updates tables to match the entities. Fine for a small single-instance
# app; a larger one would use versioned migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# The H2 web console must never be reachable in production
spring.h2.console.enabled=false

# ---- Secrets and origins: required, no defaults ----
centsible.jwt.secret=${JWT_SECRET}
# Only needed when the frontend is served from a different address than the API. When both
# sit behind one domain (the Vercel setup in DEPLOY.md) requests are same-origin, no CORS
# is involved, and this can stay unset.
centsible.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---- Hosting ----
# Most platforms tell the app which port to listen on via PORT
server.port=${PORT:8080}
# Behind the platform's proxy, resolve the real client address (used by the login/signup
# rate limiter) from the proxy's forwarded header - only trusted when the request actually
# arrived through a trusted proxy, so clients can't spoof it.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
# Trust the forwarded address from whatever connects. Only safe because this server is reachable
# solely through the hosting platform's proxy, which overwrites X-Forwarded-For with the real
# visitor address (Vercel documents this). Without it every visitor would look like the proxy
# and share one login rate limit. If you ever expose this server directly, restrict this.
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:.*}
